#soundToggle {

<script>

/* =========================================================
   SOUND SYSTEM
========================================================= */

let soundEnabled = true;

let audioContext = null;


/* =========================
   START AUDIO
========================= */

function startAudio() {

    if (!audioContext) {

        audioContext =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();
    }

    if (
        audioContext.state ===
        "suspended"
    ) {

        audioContext.resume();
    }
}


/* =========================
   SOUND TOGGLE
========================= */

function toggleSound() {

    soundEnabled =
        !soundEnabled;

    document
        .getElementById("soundToggle")
        .textContent =
        soundEnabled
            ? "🔊"
            : "🔇";

    if (soundEnabled) {

        startAudio();
    }
}


/* =========================================================
   UNIVERSAL CONTINUE SOUND
========================================================= */

/*
    THIS IS THE IMPORTANT PART.

    EVERY "PRESS ANYWHERE TO CONTINUE"
    USES THIS SAME SOUND.

    The sound is the clock tick.

    It does NOT play automatically.
*/

function playContinueSound() {

    if (!soundEnabled) return;

    playClock();
}


/* =========================
   CLOCK SFX
========================= */

function playClock() {

    if (!soundEnabled) return;

    startAudio();


    const oscillator =
        audioContext.createOscillator();

    const gain =
        audioContext.createGain();


    oscillator.type =
        "square";


    oscillator.frequency.value =
        900;


    gain.gain.setValueAtTime(
        0.025,
        audioContext.currentTime
    );


    gain.gain.exponentialRampToValueAtTime(
        0.001,
        audioContext.currentTime + 0.08
    );


    oscillator.connect(gain);

    gain.connect(
        audioContext.destination
    );


    oscillator.start();


    oscillator.stop(
        audioContext.currentTime + 0.08
    );
}


/* =========================================================
   WIND SFX
========================================================= */

function playWind() {

    if (!soundEnabled) return;

    startAudio();


    const duration = 1.5;


    const buffer =
        audioContext.createBuffer(
            1,
            audioContext.sampleRate *
                duration,
            audioContext.sampleRate
        );


    const data =
        buffer.getChannelData(0);


    for (
        let i = 0;
        i < data.length;
        i++
    ) {

        data[i] =
            (Math.random() * 2 - 1)
            * 0.12;
    }


    const source =
        audioContext
            .createBufferSource();


    const filter =
        audioContext
            .createBiquadFilter();


    const gain =
        audioContext
            .createGain();


    filter.type =
        "lowpass";

    filter.frequency.value =
        900;

    gain.gain.value =
        0.12;


    source.buffer =
        buffer;


    source.connect(filter);

    filter.connect(gain);

    gain.connect(
        audioContext.destination
    );


    source.start();


    gain.gain.exponentialRampToValueAtTime(
        0.001,
        audioContext.currentTime + duration
    );
}


/* =========================================================
   VOICE STATIC
========================================================= */

function playStatic() {

    if (!soundEnabled) return;

    startAudio();


    const duration = 1.2;


    const buffer =
        audioContext.createBuffer(
            1,
            audioContext.sampleRate *
                duration,
            audioContext.sampleRate
        );


    const data =
        buffer.getChannelData(0);


    for (
        let i = 0;
        i < data.length;
        i++
    ) {

        data[i] =
            (Math.random() * 2 - 1)
            * 0.18;
    }


    const source =
        audioContext
            .createBufferSource();


    const gain =
        audioContext
            .createGain();


    gain.gain.value =
        0.08;


    source.buffer =
        buffer;


    source.connect(gain);

    gain.connect(
        audioContext.destination
    );


    source.start();
}


/* =========================================================
   STORY
========================================================= */

const scenes = {


/* =========================================================
   OPENING
========================================================= */

home: {

    mood:
        "morning",

    title:
        "",

    blocks: [

        `The clock ticks,
As I talk.
The sky shifts,
And I carry on.`,

        `But still, sometimes,
Something lingers
At the bottom of my heart.`,

        `It feels unexplainable,
Perhaps it is the longing
For someone I once had.`,

        `One nostalgic afternoon,
As I sit and stare
At a distance still hanging in the air,
I cannot help but wonder,`,

        `“What could have happened
If you were still by our side?”`

    ],

    next:
        "photo"
},


/* =========================================================
   PHOTO
========================================================= */

photo: {

    mood:
        "memory",

    title:
        "The Photo",

    blocks: [

        `I glanced at the book on the table,
Filled with photographs
That captured moments in time.`,

        `Sweet moments,
At least, that is how I remember them.`,

        `A photograph fell
From the book in my hands.`,

        `I picked it up and stared.`,

        `There were five people
In the photograph.`,

        `I remember four names.`,

        `The fifth person
Was blurred,

physically,

yet sharply defined
In the photograph
And in our minds.`,

        `As a cold breeze passed through,
The chimes sang a quiet song.

It felt nostalgic.`

    ],

    next:
        "door"
},


/* =========================================================
   DOOR
========================================================= */

door: {

    mood:
        "darker",

    title:
        "The Door",

    blocks: [

        `Page after page,
I reached the end
And closed the book.`,

        `I stood up.`,

        `Then I stopped by the door.`,

        `It was open.`,

        `I remember this clearly.

Or perhaps
I remember it because
The other photograph shows it open.`,

        `The hallway beyond it
Was darker than I remembered.`,

        `There was a shoe
Beside the doorway.

One shoe.`

    ],

    interaction:
        "shoe",

    next:
        "voice"
},


/* =========================================================
   VOICE
========================================================= */

voice: {

    mood:
        "darker",

    title:
        "The Voice",

    blocks: [

        `“Wait.”`,

        `Three words.`,

        `That is all I remember.`,

        `Maybe there were more.`,

        `Maybe my mind
Cut the rest away.`,

        `The voice sounded familiar.

A friend?
A stranger?
A parent?`

    ],

    interaction:
        "voice",

    next:
        "clock"
},


/* =========================================================
   CLOCK
========================================================= */

clock: {

    mood:
        "darker",

    title:
        "The Clock",

    blocks: [

        `7:51`,

        `I was worried.

Mom was worried sick
And kept calling.

My siblings were worried too.
They kept calling.`,

        `I could not comprehend
What was happening at the time.`,

        `7:51 was when I messaged you,
Asking why you were not answering Mom’s calls.`,

        `I called.

The phone was answered moments later.`,

        `That was when she knew the truth.`,

        `7:51 was when the house
Was filled with tears.`,

        `A single minute
Had never felt so long.`

    ],

    interaction:
        "clock",

    next:
        "memory"
},


/* =========================================================
   REMINISCING
========================================================= */

memory: {

    mood:
        "memory",

    title:
        "Reminiscing",

    blocks: [

        `I find reminiscing
To be a double-edged sword.`,

        `Good memories remain.

Bad memories linger.`,

        `A sound snapped me back to reality.

Or was it the door?

Or the voice?`,

        `But memories
Do not always keep time.`,

        `SOUND

Wind chimes.`,

        `DOOR

Left open.`,

        `VOICE

“Wait.”`,

        `CLOCK

7:51`,

        `PHOTO

Five people.
One blurred.`,

        `7:51.

The door was open.

The voice said, “Wait.”

There were five people.

One of them
Never appeared again.`

    ],

    next:
        "last"
},


/* =========================================================
   TRIP DOWN MEMORY LANE
========================================================= */

last: {

    mood:
        "final",

    title:
        "Trip Down Memory Lane",

    blocks: [

        `I remember it all now.

Vividly.

Not everything.

Only enough.`,

        `The photograph was taken
Years ago,
When everything was still innocent.`,

        `The clock moved forward
As it happened.`,

        `The door opened
Afterward.`,

        `And the voice...`,

        `The voice belonged to me.`,

        `Because I was the one
Who said,

“Wait.”`,

        `I was trying
To stop someone
From going away
Forever.`

    ],

    next:
        "final"
},


/* =========================================================
   FINAL
========================================================= */

final: {

    mood:
        "final",

    title:
        "",

    blocks: [

        `Some memories disappear
Because time takes them.`,

        `Others disappear
Because of painful events.`,

        `But forgotten
Does not mean gone.`,

        `7:51`

    ],

    interaction:
        "final",

    next:
        "restart"
},


/* =========================================================
   RESTART
========================================================= */

restart: {

    mood:
        "morning",

    title:
        "",

    blocks: [

        `I woke up`,

        `With the book in my hands
And photographs scattered
Across the floor.`

    ],

    next:
        "home"
}

};


/* =========================================================
   STATE
========================================================= */

let currentScene =
    "home";

let currentBlock =
    0;

let interactionUsed =
    false;


/* =========================================================
   MOOD
========================================================= */

function setMood(mood) {

    const background =
        document.getElementById(
            "background"
        );

    background.className = "";

    if (mood) {

        background.classList.add(
            mood
        );
    }
}


/* =========================================================
   RENDER SCENE
========================================================= */

function renderScene(sceneName) {

    currentScene =
        sceneName;

    currentBlock =
        0;

    interactionUsed =
        false;


    const scene =
        scenes[sceneName];


    setMood(
        scene.mood
    );


    const story =
        document.getElementById(
            "story"
        );


    story.classList.add(
        "fade-out"
    );


    setTimeout(() => {

        story.innerHTML =
            "";


        if (scene.title) {

            const title =
                document.createElement(
                    "h1"
                );

            title.className =
                "scene-title";

            title.textContent =
                scene.title;

            story.appendChild(
                title
            );
        }


        showBlock();


        story.classList.remove(
            "fade-out"
        );

    }, 700);
}


/* =========================================================
   SHOW BLOCK
========================================================= */

function showBlock() {

    const scene =
        scenes[currentScene];


    const story =
        document.getElementById(
            "story"
        );


    const oldPoem =
        document.querySelector(
            ".poem"
        );


    if (oldPoem) {

        oldPoem.remove();
    }


    const poem =
        document.createElement(
            "div"
        );


    poem.className =
        "poem";


    const text =
        scene.blocks[
            currentBlock
        ];


    const lines =
        text.split("\n");


    lines.forEach(
        (line, index) => {

            const span =
                document.createElement(
                    "div"
                );


            span.className =
                "poem-line";


            span.textContent =
                line === ""
                    ? "\u00A0"
                    : line;


            span.style.animationDelay =
                `${index * 0.12}s`;


            poem.appendChild(
                span
            );
        }
    );


    story.appendChild(
        poem
    );


    const oldContinue =
        document.getElementById(
            "continue"
        );


    if (oldContinue) {

        oldContinue.remove();
    }


    const oldInteraction =
        document.querySelector(
            ".interaction"
        );


    if (oldInteraction) {

        oldInteraction.remove();
    }


    /* =========================
       MORE TEXT
    ========================= */

    if (
        currentBlock <
        scene.blocks.length - 1
    ) {

        createContinueButton();

        return;
    }


    /* =========================
       INTERACTION
    ========================= */

    if (scene.interaction) {

        showInteraction(
            scene.interaction
        );

        return;
    }


    /* =========================
       NEXT SCENE
    ========================= */

    createNextButton();
}


/* =========================================================
   UNIVERSAL CONTINUE BUTTON
========================================================= */

function createContinueButton() {

    const button =
        document.createElement(
            "button"
        );


    button.id =
        "continue";


    button.textContent =
        "Press anywhere to continue";


    button.onclick = () => {

        /*
            UNIVERSAL CLOCK SFX.

            Every Continue button
            uses the same sound.
        */

        playContinueSound();


        currentBlock++;


        showBlock();
    };


    document
        .getElementById("story")
        .appendChild(button);
}


/* =========================================================
   NEXT SCENE BUTTON
========================================================= */

function createNextButton() {

    const scene =
        scenes[currentScene];


    const button =
        document.createElement(
            "button"
        );


    button.id =
        "continue";


    button.textContent =
        "Press anywhere to continue";


    button.onclick = () => {

        /*
            SAME UNIVERSAL SOUND.
        */

        playContinueSound();


        goTo(
            scene.next
        );
    };


    document
        .getElementById("story")
        .appendChild(button);
}


/* =========================================================
   INTERACTIONS
========================================================= */

function showInteraction(type) {

    const story =
        document.getElementById(
            "story"
        );


    const interaction =
        document.createElement(
            "div"
        );


    interaction.className =
        "interaction";


    /* =========================
       SHOE
    ========================= */

    if (type === "shoe") {

        const label =
            document.createElement(
                "div"
            );

        label.className =
            "small-text";

        label.textContent =
            "Click the shoe.";


        interaction.appendChild(
            label
        );


        const shoe =
            document.createElement(
                "div"
            );


        shoe.className =
            "shoe";


        shoe.onclick = () => {

            if (interactionUsed)
                return;


            interactionUsed =
                true;


            playWind();


            interaction.innerHTML = `

                <div class="interaction-result">

                    I remember looking
                    For the other one.

                    <br><br>

                    I never found it.

                </div>

            `;


            setTimeout(() => {

                createNextButton();

            }, 1400);
        };


        interaction.appendChild(
            shoe
        );


        story.appendChild(
            interaction
        );
    }


    /* =========================
       VOICE
    ========================= */

    if (type === "voice") {

        const button =
            document.createElement(
                "button"
            );


        button.textContent =
            "Listen Again";


        button.onclick = () => {

            if (interactionUsed)
                return;


            interactionUsed =
                true;


            playStatic();


            interaction.innerHTML = `

                <div class="interaction-result">

                    Static.

                    <br><br>

                    A faint voice.

                    <br><br>

                    Then silence.

                </div>

            `;


            setTimeout(() => {

                createNextButton();

            }, 1400);
        };


        interaction.appendChild(
            button
        );


        story.appendChild(
            interaction
        );
    }


    /* =========================
       CLOCK
    ========================= */

    if (type === "clock") {

        const button =
            document.createElement(
                "button"
            );


        button.textContent =
            "Why 7:51?";


        button.onclick = () => {

            if (interactionUsed)
                return;


            interactionUsed =
                true;


            playClock();


            interaction.innerHTML = `

                <div class="interaction-result">

                    7:51 was when I messaged you,
                    asking why you were not answering
                    Mom’s calls.

                    <br><br>

                    I called.

                    <br><br>

                    The phone was answered moments later.

                    <br><br>

                    That was when she knew the truth.

                </div>

            `;


            setTimeout(() => {

                createNextButton();

            }, 2000);
        };


        interaction.appendChild(
            button
        );


        story.appendChild(
            interaction
        );
    }


    /* =========================
       FINAL
    ========================= */

    if (type === "final") {

        const stopButton =
            document.createElement(
                "button"
            );


        stopButton.textContent =
            "STOP";


        stopButton.onclick = () => {

            if (interactionUsed)
                return;


            interactionUsed =
                true;


            interaction.innerHTML = `

                <div class="interaction-result">

                    7:51

                </div>

            `;


            setTimeout(() => {

                const startButton =
                    document.createElement(
                        "button"
                    );


                startButton.textContent =
                    "START";


                startButton.onclick = () => {

                    playClock();


                    goTo(
                        "restart"
                    );
                };


                interaction.appendChild(
                    startButton
                );

            }, 1200);
        };


        interaction.appendChild(
            stopButton
        );


        story.appendChild(
            interaction
        );
    }
}


/* =========================================================
   CHANGE SCENE
========================================================= */

function goTo(sceneName) {

    const fade =
        document.getElementById(
            "fade"
        );


    fade.classList.add(
        "active"
    );


    setTimeout(() => {

        renderScene(
            sceneName
        );


        setTimeout(() => {

            fade.classList.remove(
                "active"
            );

        }, 100);

    }, 800);
}


/* =========================================================
   START
========================================================= */

renderScene(
    "home"
);

</script>
