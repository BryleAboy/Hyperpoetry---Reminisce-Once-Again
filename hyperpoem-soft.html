<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Untitled Hyperpoem</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Caveat:wght@500&display=swap" rel="stylesheet">
<style>
:root{--ink:#4b4563;--dim:#8f89a6;--rose:#b96a83;--glow:255,236,214;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;color:var(--ink)}
body{font-family:'Cormorant Garamond',Georgia,serif;font-size:clamp(1.2rem,2.6vw,1.5rem);line-height:1.6;text-align:center;background:linear-gradient(180deg,#cfe0f0 0%,#e4dcf0 48%,#f8e3e4 100%)}
#sky{position:fixed;inset:0;overflow:hidden;pointer-events:none}
.cl{position:absolute;border-radius:50%;background:radial-gradient(closest-side,rgba(255,255,255,.85),rgba(255,255,255,0));filter:blur(18px);animation:dr linear infinite}
@keyframes dr{from{transform:translateX(-30vw)}to{transform:translateX(130vw)}}
.mote{position:absolute;border-radius:50%;background:rgba(255,246,230,.95);box-shadow:0 0 10px 3px rgba(255,240,215,.8);animation:fl ease-in-out infinite}
@keyframes fl{0%,100%{transform:translateY(0);opacity:.2}50%{transform:translateY(-40px);opacity:.9}}
#sun{position:absolute;left:50%;top:-14vh;width:70vmin;height:70vmin;transform:translateX(-50%);background:radial-gradient(closest-side,rgba(255,244,222,.9),rgba(255,244,222,0))}
#stage{position:relative;z-index:2;height:100%;overflow-y:auto;padding:10vh 8vw 14vh;max-width:40rem;margin:0 auto;transition:transform .8s cubic-bezier(.5,0,.3,1),opacity .8s,filter .8s}
.out-f{transform:scale(4);opacity:0;filter:blur(10px)}
.out-b{transform:scale(.5);opacity:0;filter:blur(8px)}
.in-f{transform:scale(.7);opacity:0;filter:blur(8px);transition:none!important}
.in-b{transform:scale(1.5);opacity:0;filter:blur(8px);transition:none!important}
h1{font-weight:400;font-style:italic;font-size:clamp(2.2rem,7vw,3.6rem);line-height:1.15;margin:0 0 2rem;text-shadow:0 0 24px rgba(255,255,255,.9)}
h2{font-weight:400;font-style:italic;font-size:1.7rem;margin:0 0 1.4rem;color:var(--dim)}
p{margin:0;text-shadow:0 0 14px rgba(255,255,255,.8)}.sp{height:1.1em}
.rev{animation:in 1.6s both}@keyframes in{from{opacity:0;filter:blur(6px);transform:translateY(6px)}}
button{font:inherit;background:none;border:0;cursor:pointer;color:var(--rose)}
.frag,.rv{font-family:'Caveat',cursive;font-size:1.9rem;margin:.3rem .9rem;padding:.2rem .9rem;border-radius:2rem;text-shadow:0 0 16px rgba(var(--glow),1),0 0 4px #fff;background:radial-gradient(closest-side,rgba(255,255,255,.55),rgba(255,255,255,0));animation:br 4s ease-in-out infinite;transition:transform .4s}
.rv{font-size:1.6rem}
@keyframes br{50%{transform:scale(1.07);text-shadow:0 0 30px rgba(255,214,170,1),0 0 6px #fff}}
.frag:hover,.frag:focus-visible,.rv:hover,.rv:focus-visible{transform:scale(1.12);outline:none}
.frag.seen{color:var(--dim);animation:none;background:none;text-shadow:none;opacity:.7;text-decoration:underline wavy rgba(143,137,166,.5);text-underline-offset:6px}
.nav{margin-top:2.4rem;display:flex;flex-wrap:wrap;justify-content:center;gap:.2rem}
.ret{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:1.15rem;color:var(--dim);animation:none;background:none;text-shadow:none}
.ph{width:120px;height:120px;margin:0 auto 1.8rem;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fff,rgba(255,232,214,.7) 45%,rgba(200,180,230,.35));box-shadow:0 0 40px 10px rgba(255,240,225,.9);animation:br 6s ease-in-out infinite}
#snd{position:fixed;left:4vw;bottom:calc(2vh + env(safe-area-inset-bottom,0px));z-index:3;font-family:'Caveat',cursive;font-size:1.2rem;color:var(--dim)}
@media(prefers-reduced-motion:reduce){.cl,.mote,.frag,.rv,.ph{animation:none}#stage{transition:opacity .3s}.out-f,.out-b,.in-f,.in-b{transform:none;filter:none}}
</style></head><body>
<div id="sky"><div id="sun"></div></div><main id="stage" aria-live="polite"></main>
<button id="snd">sound: off</button>
<script>
const PL=['Placeholder line one.','Placeholder line two.','','Placeholder line three.','Placeholder line four.'];
const ORB='<div class="ph" aria-hidden="true"></div>';
const FR=['frag1','frag2','frag3','frag4'];
const S={
home:{t:'Title of Your Poem',l:['Opening lines go here.','','A second stanza goes here.','','Click a fragment.'],links:FR},
frag1:{h:'Fragment One',art:ORB,l:PL,r:[{b:'reveal more',l:['Hidden text appears here.']}]},
frag2:{h:'Fragment Two',art:ORB,l:PL,r:[{b:'reveal more',l:['Hidden text appears here.']}]},
frag3:{h:'Fragment Three',art:ORB,l:PL,r:[{b:'reveal more',l:['Hidden text appears here.']}]},
frag4:{h:'Fragment Four',art:ORB,l:PL,seq:1,r:[{b:'go deeper',l:['First hidden layer.']},{b:'look closer',l:['Second hidden layer.']}]},
missing:{h:'The Gathering',l:['Text that introduces the pieces coming together.'],par:1,ret:1,next:['memory','continue'],r:[{b:'word one',l:['Text one.']},{b:'word two',l:['Text two.']},{b:'word three',l:['Text three.']},{b:'word four',l:['Text four.']},{b:'word five',l:['Text five.']},{b:'bring them together',l:['Combined text appears here.']}]},
memory:{h:'The Memory',art:ORB,l:PL,r:[{b:'why?',l:['Explanation text goes here.']}],next:['last','continue']},
last:{h:'The Last Fragment',art:ORB,l:PL,r:[{b:'reveal the ending',l:['A final word or line goes here.']}],next:['final','final page']},
final:{h:'',l:['Closing lines go here.','','A final line goes here.'],restart:1}
};
const st=document.getElementById('stage');let cur='home',seen=new Set(),opened={},busy=false,on=false,ac;
// sky
(function(){const k=document.getElementById('sky');for(let i=0;i<4;i++){const c=document.createElement('div');c.className='cl';const w=30+Math.random()*30;c.style.cssText=`width:${w}vw;height:${w*.4}vw;top:${Math.random()*70}vh;animation-duration:${90+Math.random()*80}s;animation-delay:-${Math.random()*120}s`;k.appendChild(c)}
for(let i=0;i<16;i++){const m=document.createElement('span');m.className='mote';const s=3+Math.random()*4;m.style.cssText=`width:${s}px;height:${s}px;left:${Math.random()*100}vw;top:${20+Math.random()*75}vh;animation-duration:${6+Math.random()*8}s;animation-delay:-${Math.random()*10}s`;k.appendChild(m)}})();
// soft chime (synthesized)
function chime(){if(!on)return;ac=ac||new (window.AudioContext||window.webkitAudioContext)();[659,880,1319].forEach((f,i)=>{const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+i*.14;o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.07,t+.03);g.gain.exponentialRampToValueAtTime(.0001,t+1.6);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+1.7)})}
document.getElementById('snd').onclick=e=>{on=!on;e.target.textContent='sound: '+(on?'on':'off');if(on){ac=ac||new (window.AudioContext||window.webkitAudioContext)();ac.resume();chime()}};
function lines(a,c){return a.map(t=>t?`<p${c?' class="'+c+'"':''}>${t}</p>`:'<div class="sp"></div>').join('')}
function render(id){cur=id;const s=S[id];let h='';
 if(id=='home'){h=`<h1>${s.t}</h1>`+lines(s.l)+'<div class="nav">'+s.links.map((k,i)=>`<button class="frag ${seen.has(k)?'seen':''}" data-go="${k}">${S[k].h.toLowerCase()}</button>`).join('')+'</div>';
  if(s.links.every(k=>seen.has(k)))h+='<div class="sp"></div><p class="rev">Text that appears once every fragment is opened.</p><div class="nav"><button class="frag" data-go="missing">the gathering</button></div>'}
 else{if(s.h)h+=`<h2>${s.h}</h2>`;h+=(s.art||'')+lines(s.l);(s.r||[]).forEach((r,i)=>{h+=`<div id="r${i}" hidden><div class="sp"></div>${lines(r.l,'rev')}</div>`});h+='<div class="nav" id="nav"></div>'}
 st.innerHTML=h;st.scrollTop=0;if(id!='home'){opened={};upd()}}
function upd(){const s=S[cur],n=s.r||[],nav=document.getElementById('nav');let h='';
 n.forEach((r,i)=>{const o=opened[i];document.getElementById('r'+i).hidden=!o;
  const vis=s.par?(i<n.length-1||n.slice(0,-1).every((_,j)=>opened[j])):(i==0||opened[i-1]);
  if(vis&&!o)h+=`<button class="rv" data-r="${i}">${r.b}</button>`});
 const done=n.every((_,i)=>opened[i]);
 if(done&&s.next)h+=`<button class="rv" data-go="${s.next[0]}">${s.next[1]}</button>`;
 if(done&&s.restart)h+='<button class="rv" data-restart="1">begin again</button>';
 if(!s.next&&!s.restart||s.ret)h+='<button class="rv ret" data-back="1">return</button>';
 nav.innerHTML=h}
function go(id,x,y,back){if(busy)return;busy=true;chime();st.style.transformOrigin=`${x}px ${y}px`;st.className=back?'out-b':'out-f';
 setTimeout(()=>{st.style.transformOrigin='50% 50%';render(id);st.className=back?'in-b':'in-f';void st.offsetWidth;st.className='';busy=false},800)}
function back(x,y){if(cur=='home')return;seen.add(cur);go('home',x,y,true)}
st.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const r=b.getBoundingClientRect(),x=r.left+r.width/2,y=r.top+r.height/2,d=b.dataset;
 if(d.go){if(d.go in S&&(FR.includes(d.go)||d.go=='missing'))seen.add(d.go);go(d.go,x,y)}
 else if(d.r!==undefined){opened[d.r]=1;upd();chime();document.getElementById('r'+d.r).scrollIntoView({behavior:'smooth',block:'nearest'});if(!S[cur].next)seen.add(cur)}
 else if(d.back)back(x,y);
 else if(d.restart){seen=new Set();go('home',x,y,true)}});
addEventListener('keydown',e=>{if(e.key=='Escape'&&(cur=='missing'||(!S[cur].next&&!S[cur].restart)))back(innerWidth/2,innerHeight/2)});
render('home');
</script></body></html>
